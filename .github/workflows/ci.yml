name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Gated at critical rather than high: the current high findings are
      # transitive through Next.js itself (postcss, sharp) with no fixed
      # release available, so gating at high would fail every run and train
      # everyone to ignore it. Dependabot raises PRs as fixes land.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
